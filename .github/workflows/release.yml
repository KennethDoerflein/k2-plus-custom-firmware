name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Repackage rootfs.ext2 and Generate Checksums
        run: |
          chmod +x scripts/repack_rootfs.sh
          sudo ./scripts/repack_rootfs.sh
          sha256sum rootfs.ext2 kernel.img swap > checksums.txt

      - name: Release Firmware Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.18
          files: |
            rootfs.ext2
            kernel.img
            swap
            index
            checksums.txt
          generate_release_notes: true