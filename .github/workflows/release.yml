name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (e.g., v6.19)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: main
      
      - name: Repackage rootfs.ext2 and Generate Checksums
        run: |
          chmod +x scripts/repack_rootfs.sh
          sudo ./scripts/repack_rootfs.sh
          python scripts/release_index.py --version "${{ inputs.tag_name }}"
          if [[ -n $(git status --porcelain extras/manifest.json index install.py bootstrap) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add extras/manifest.json index install.py bootstrap
            git commit -m "Auto-update release checksums and manifest for ${{ inputs.tag_name }} [skip ci]"
            git push origin main
          fi
          sha256sum rootfs.ext2 kernel.img swap > checksums.txt

      - name: Release Firmware Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: main
          files: |
            rootfs.ext2
            kernel.img
            swap
            index
            checksums.txt
          generate_release_notes: true