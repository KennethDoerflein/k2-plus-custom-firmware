name: CI & Compatibility Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Compatibility & Release Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-update Release Checksums & Manifest
        run: |
          python scripts/release_index.py
          if [[ -n $(git status --porcelain extras/manifest.json index install.py) ]]; then
            if [[ "${{ github.event_name }}" == "push" ]]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add extras/manifest.json index install.py
              git commit -m "Auto-update release checksums and manifest [skip ci]"
              git push
            fi
          fi

      - name: Run Static Compatibility Tests
        run: |
          python -m unittest discover -s tests -v
