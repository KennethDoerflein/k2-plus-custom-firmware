name: Automated Upstream Sync

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/Jacob10383/k2-plus-custom-firmware.git || git remote set-url upstream https://github.com/Jacob10383/k2-plus-custom-firmware.git
          git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Already up to date with upstream/main."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New upstream commits found."
          fi

      - name: Perform Safe Sync
        if: steps.check.outputs.has_changes == 'true'
        id: sync
        run: |
          # Run sync script with auto-commit
          if python scripts/sync_upstream.py --commit; then
            echo "sync_status=clean" >> $GITHUB_OUTPUT
          else
            echo "sync_status=conflicts" >> $GITHUB_OUTPUT
            # Never commit conflict markers: back out the merge entirely.
            git merge --abort || true
            git reset --hard HEAD
          fi

      - name: Create Pull Request (clean merges only)
        if: steps.check.outputs.has_changes == 'true' && steps.sync.outputs.sync_status == 'clean'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automated-upstream-sync
          title: "chore(upstream): automated sync with upstream Jacob10383/k2-plus-custom-firmware"
          commit-message: "chore(upstream): sync changes from Jacob10383/k2-plus-custom-firmware"
          body: |
            ## Automated Upstream Sync

            New commits were detected and merged cleanly from `upstream/main` (`Jacob10383/k2-plus-custom-firmware`).

            - **Checksum files**: Automatically verified and regenerated via `scripts/release_index.py`.
            - **Compatibility tests**: Executed via `tests/test_compat.py`.

            Review for upstream telemetry (`send_telemetry`, `TELEMETRY_URL`) and branding before merging.
          labels: |
            upstream-sync
            automated

      - name: Fail on conflicts
        if: steps.sync.outputs.sync_status == 'conflicts'
        run: |
          echo "::error::Upstream merge has conflicts. No PR was opened. Merge upstream/main locally and resolve by hand."
          exit 1
